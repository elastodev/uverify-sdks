[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "uverify"
version = "0.1.0"
description = "Official Python library for the UVerify API: BVN, NIN and ID checks, liveness, face match, ID documents and AML screening for Nigeria."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Elasto Web Services Limited" }]
keywords = ["uverify", "kyc", "bvn", "nin", "liveness", "face-match", "aml", "nigeria"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://uverify.com.ng"
Documentation = "https://uverify.com.ng/docs"
Source = "https://github.com/elastodev/uverify-sdks"

[tool.hatch.build.targets.wheel]
packages = ["src/uverify"]
